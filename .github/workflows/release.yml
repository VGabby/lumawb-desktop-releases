name: Build release installers and signed updates

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed 40-character commit from the private release branch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: windows-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LUMAWB_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Check out public build instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable source revision
        shell: bash
        run: node -e "if (!/^[a-f0-9]{40}$/i.test(process.env.LUMAWB_SOURCE_COMMIT || '')) process.exit(1);"
      - name: Check out private source with temporary read-only key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: VGabby/lumawb-inference
          ref: release/lumawb-desktop
          path: private-source
          ssh-key: ${{ secrets.LUMAWB_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.88.0'
          targets: ${{ matrix.target }}
      - name: Validate, test, build and sign updates without exposing compiler output (Windows)
        if: runner.os == 'Windows'
        # PowerShell keeps Windows tar.exe ahead of Git's tar, which reads C: as a host.
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-release.mjs
      - name: Validate, test, build and sign updates without exposing compiler output (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-release.mjs
      - name: Upload installers, update files and checksums, or encrypted failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumawb-desktop-${{ matrix.platform }}-${{ inputs.source_commit }}
          path: installer-artifacts/
          if-no-files-found: ignore
          retention-days: 1

# This public repository contains only build orchestration. There are no push/PR
# triggers, secrets in files, source or plaintext log uploads, or publication.
# The update signing key is passed only to the installer build step; the build
# script removes it from the environment of every other command.
