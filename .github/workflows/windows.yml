name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed 40-character commit from the private release branch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    environment: windows-release
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      LUMAWB_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Check out public build instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable source revision
        shell: pwsh
        run: node -e "if (!/^[a-f0-9]{40}$/i.test(process.env.LUMAWB_SOURCE_COMMIT || '')) process.exit(1);"
      - name: Check out private source with temporary read-only key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: VGabby/lumawb-inference
          ref: release/lumawb-desktop
          path: private-source
          ssh-key: ${{ secrets.LUMAWB_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.88.0'
          targets: x86_64-pc-windows-msvc
      - name: Validate, test, and build without exposing compiler output
        shell: pwsh
        run: node scripts/build-windows.mjs
      - name: Upload installers and checksums only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumawb-desktop-win32-x64-${{ inputs.source_commit }}
          path: installer-artifacts/
          if-no-files-found: error
          retention-days: 1

# This public repository contains only build orchestration. There are no push/PR
# triggers, secrets in files, source/log uploads, publication, or signing jobs.
